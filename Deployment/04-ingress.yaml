apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: hello-world
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Shared across every app's Ingress deployed to this same cluster/
    # environment, so they all resolve to ONE ALB instead of one each --
    # AWS Load Balancer Controller merges any Ingress with a matching
    # group.name into a single load balancer within a cluster (dev/prod are
    # separate clusters, so this doesn't need to be globally unique across
    # environments -- just consistent within one). Any new app cloned from
    # this one (e.g. abc-app) should use this same "${ENVIRONMENT}-cluster"
    # pattern. IMPORTANT: since this app's rule below has no `host` and
    # claims path "/", a second app sharing this group MUST use a distinct
    # `host` (or a distinct non-root path) in its own Ingress rule, or the
    # controller will reject both as conflicting/ambiguous routes on the
    # same ALB.
    alb.ingress.kubernetes.io/group.name: ${ENVIRONMENT}-cluster
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
